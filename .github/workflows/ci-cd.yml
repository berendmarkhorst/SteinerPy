name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave blank to bump patch)"
        required: false
        type: string

# Serialize workflow runs so manual releases cannot race on the version bump/push.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so Codecov can find the base/parent commit
        # (avoids the "missing base report" / "unable to determine parent" warning).
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=steinerpy --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation (Python 3.12)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    - name: Install documentation dependencies
      run: uv sync --python 3.12 --extra docs --frozen
    - name: Execute and validate examples
      run: uv run --frozen python docs/check_examples.py
    - name: Build documentation
      run: uv run --frozen sphinx-build -b html -W --keep-going docs/source docs/_build/html

  release:
    name: Bump version & publish to PyPI
    needs: [test, docs]
    # Release only when manually triggered on main, after all tests pass.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Dedicated environment for publishing — register this name on PyPI's
    # trusted-publisher config (Publishing -> Add a pending publisher).
    environment:
      name: pypi
      url: https://pypi.org/project/steinerpy/

    permissions:
      contents: write   # push the bump commit + tag back to main
      id-token: write   # OIDC trusted publishing to PyPI (no API token needed)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Set release version
      id: bump
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$RELEASE_VERSION" ]; then
          uv version "$RELEASE_VERSION"
        else
          uv version --bump patch
        fi
        NEW_VERSION=$(uv version --short)
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "Releasing $NEW_VERSION"
        uv lock

    - name: Commit, tag, and push
      run: |
        git add pyproject.toml uv.lock
        if ! git diff --cached --quiet; then
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
        fi
        git tag -a "v${{ steps.bump.outputs.version }}" -m "Release ${{ steps.bump.outputs.version }}"
        git push origin HEAD:main --follow-tags

    - name: Build distributions
      run: uv build

    - name: Publish to PyPI
      # uv auto-detects the OIDC token from id-token: write — no PYPI_API_TOKEN.
      run: uv publish
